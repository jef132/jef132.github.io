<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-content">
        <div>
          <p class="eyebrow">Professional Profile</p>
          <h1>{{ site.name }}</h1>
          <p class="subtitle">{{ site.role }} | {{ site.certifications }}</p>
        </div>
        <div class="header-links">
          <a class="button" href="mailto:{{ site.email }}">Email</a>
          <a class="button button-secondary" href="https://www.linkedin.com/in/jefa" target="_blank" rel="noreferrer">LinkedIn</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.name }}. Built with Jekyll.</p>
    </div>
  </footer>
</body>
</html>
